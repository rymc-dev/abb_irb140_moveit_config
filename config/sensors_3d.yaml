sensors: []
# Disabled: default_sensor's PointCloudOctomapUpdater was live-building
# move_group's octomap straight from the D405's /camera/depth/color/points,
# independent of real_robot.launch.py's own use_octomap flag -- the D405's
# depth noise was producing false occupied voxels in the planning scene.
# kinect_depthimage was unused leftover template config (points at a
# /head_mount_kinect topic nothing on this robot publishes).
default_sensor:
  filtered_cloud_topic: filtered_cloud
  max_range: 5.0
  max_update_rate: 1.0
  padding_offset: 0.1
  padding_scale: 1.0
  point_cloud_topic: /camera/depth/color/points
  point_subsample: 1
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
kinect_depthimage:
  far_clipping_plane_distance: 5.0
  filtered_cloud_topic: filtered_cloud
  image_topic: /head_mount_kinect/depth_registered/image_raw
  max_update_rate: 1.0
  near_clipping_plane_distance: 0.3
  padding_offset: 0.03
  padding_scale: 4.0
  queue_size: 5
  sensor_plugin: occupancy_map_monitor/DepthImageOctomapUpdater
  shadow_threshold: 0.2