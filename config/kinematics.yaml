# Was previously empty ({}) -- the original demo (pick_and_place_demo_node's
# hard-coded joint-space waypoints) never needed IK, so no kinematics solver
# was ever configured. abb_irb140_motion_control's ball_pick_and_place_node
# plans to Cartesian poses (setPoseTarget), which requires a KinematicsBase
# plugin to sample joint-space goal regions -- without one, OMPL fails
# immediately with "Unable to construct goal representation" for any pose
# goal. KDLKinematicsPlugin (moveit_kinematics) is the standard default
# solver for a 6-DOF serial chain like the IRB140's irb140_planning_group
# (base_link -> tool0).
irb140_planning_group:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.005
